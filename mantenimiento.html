<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Never Off — Volvemos enseguida</title>
<style>
  :root{
    --bg:#0A0A0A; --panel:#141414; --line:#262626;
    --yellow:#FFEA2A; --ink:#FEE9B2; --muted:#9a9788;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:24px;
    background-image:radial-gradient(1200px 600px at 50% -10%, rgba(255,234,42,.06), transparent 60%);
  }
  .card{ width:100%; max-width:440px; text-align:center }
  .logo{
    width:120px; height:120px; border-radius:50%;
    display:block; margin:0 auto 28px;
    box-shadow:0 10px 40px rgba(255,234,42,.18);
  }
  h1{
    color:var(--yellow); font-size:26px; font-weight:800;
    letter-spacing:-.02em; margin:0 0 12px; line-height:1.15;
  }
  p{ font-size:15px; line-height:1.6; color:var(--ink); margin:0 0 8px }
  .muted{ color:var(--muted); font-size:13.5px; margin-top:6px }
  .btn{
    display:inline-block; margin-top:26px; cursor:pointer;
    background:var(--yellow); color:#000; font-weight:800; font-size:15px;
    border:none; border-radius:999px; padding:14px 30px; text-decoration:none;
    transition:transform .08s ease, filter .15s ease;
  }
  .btn:hover{ filter:brightness(1.05) }
  .btn:active{ transform:scale(.97) }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--yellow); margin-right:8px; animation:pulse 1.4s ease-in-out infinite }
  @keyframes pulse{ 0%,100%{opacity:.35} 50%{opacity:1} }
  @media (prefers-reduced-motion:reduce){ .dot{animation:none} }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="https://neveroffapp.com/never-off-bimi.svg" alt="Never Off">
    <h1>Volvemos enseguida</h1>
    <p><span class="dot"></span>Estamos afinando algo por unos minutos.</p>
    <p>Tus redes siguen activas. Vuelve a intentar en un momento.</p>
    <p class="muted">Si el problema continúa, escríbenos a soporte@neveroffapp.com</p>
    <a class="btn" href="/" onclick="location.reload();return false;">Reintentar</a>
  </main>
</body>
</html>
